name: "🧪 test"

on:
  push:
  pull_request:

jobs:
  test:
    name: "🧪 node ${{ matrix.node }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v5

      - name: 🟢 node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: 🧪 test
        run: npm test
